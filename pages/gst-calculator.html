<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GST Inclusive & Exclusive Calculator | InfoBridgeIndia</title>
  <meta
    name="description"
    content="Free GST Inclusive and Exclusive Calculator. Calculate taxable value, GST amount, CGST, SGST and IGST instantly."
  />

  <link rel="stylesheet" href="../css/style.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .gst-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gst-logo {
      font-size: 22px;
      font-weight: 800;
      color: #1565c0;
      text-decoration: none;
    }

    .back-link {
      color: #374151;
      text-decoration: none;
      font-weight: 600;
    }

    .gst-section {
      min-height: calc(100vh - 70px);
      padding: 55px 20px;
    }

    .gst-container {
      max-width: 1050px;
      margin: auto;
    }

    .gst-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .gst-title h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 45px);
    }

    .gst-title p {
      margin: 0;
      color: #64748b;
      font-size: 17px;
    }

    .gst-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      align-items: start;
    }

    .gst-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
    }

    .gst-card h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-box {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .calculate-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .calculate-btn:hover {
      background: #0d4f9f;
    }

    .error-message {
      display: none;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: 600;
    }

    .result-card {
      background: linear-gradient(145deg, #ecfdf5, #ffffff);
      border: 1px solid #a7f3d0;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #d1fae5;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-label {
      color: #475569;
      font-weight: 600;
    }

    .result-value {
      font-weight: 800;
      text-align: right;
    }

    .final-row {
      margin-top: 10px;
      padding: 18px;
      border-radius: 12px;
      background: #047857;
      color: white;
      border-bottom: none;
    }

    .final-row .result-label,
    .final-row .result-value {
      color: white;
      font-size: 19px;
    }

    .hidden {
      display: none;
    }

    .reset-btn {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #1565c0;
      color: #1565c0;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .gst-grid {
        grid-template-columns: 1fr;
      }

      .option-grid {
        grid-template-columns: 1fr;
      }

      .gst-section {
        padding: 35px 14px;
      }

      .gst-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="gst-header">
    <a href="../index.html" class="gst-logo">InfoBridgeIndia</a>
    <a href="../index.html" class="back-link">← Home</a>
  </header>

  <main class="gst-section">
    <div class="gst-container">

      <div class="gst-title">
        <h1>GST Calculator</h1>
        <p>Calculate GST inclusive, exclusive, CGST, SGST and IGST instantly.</p>
      </div>

      <div class="gst-grid">

        <section class="gst-card">
          <h2>Enter Details</h2>

          <div class="form-group">
            <label for="amount">Amount ₹</label>
            <input
              type="number"
              id="amount"
              placeholder="Example: 150000"
              min="0"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label for="gstRate">GST Rate</label>
            <select id="gstRate">
              <option value="">Select GST Rate</option>
              <option value="0">0%</option>
              <option value="0.25">0.25%</option>
              <option value="3">3%</option>
              <option value="5">5%</option>
              <option value="12">12%</option>
              <option value="18">18%</option>
              <option value="28">28%</option>
            </select>
          </div>

          <div class="form-group">
            <label>Calculation Type</label>

            <div class="option-grid">
              <label class="option-box">
                <input
                  type="radio"
                  name="calculationType"
                  value="exclusive"
                  checked
                />
                GST Exclusive
              </label>

              <label class="option-box">
                <input
                  type="radio"
                  name="calculationType"
                  value="inclusive"
                />
                GST Inclusive
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Transaction Type</label>

            <div class="option-grid">
              <label class="option-box">
                <input
                  type="radio"
                  name="transactionType"
                  value="same"
                  checked
                />
                Same State
              </label>

              <label class="option-box">
                <input
                  type="radio"
                  name="transactionType"
                  value="interstate"
                />
                Other State
              </label>
            </div>
          </div>

          <button type="button" class="calculate-btn" id="calculateBtn">
            Calculate GST
          </button>

          <div class="error-message" id="errorMessage"></div>
        </section>

        <section class="gst-card result-card">
          <h2>GST Calculation Result</h2>

          <div class="result-row">
            <span class="result-label">Taxable Value</span>
            <span class="result-value" id="taxableValue">₹0.00</span>
          </div>

          <div class="result-row">
            <span class="result-label">Total GST</span>
            <span class="result-value" id="gstAmount">₹0.00</span>
          </div>

          <div id="sameStateResults">
            <div class="result-row">
              <span class="result-label" id="cgstLabel">CGST</span>
              <span class="result-value" id="cgstAmount">₹0.00</span>
            </div>

            <div class="result-row">
              <span class="result-label" id="sgstLabel">SGST</span>
              <span class="result-value" id="sgstAmount">₹0.00</span>
            </div>
          </div>

          <div id="interstateResults" class="hidden">
            <div class="result-row">
              <span class="result-label" id="igstLabel">IGST</span>
              <span class="result-value" id="igstAmount">₹0.00</span>
            </div>
          </div>

          <div class="result-row final-row">
            <span class="result-label">Final Amount</span>
            <span class="result-value" id="finalAmount">₹0.00</span>
          </div>

          <button type="button" class="reset-btn" id="resetBtn">
            Reset
          </button>
        </section>

      </div>
    </div>
  </main>

  <script src="../js/gst-calculator.js"></script>
</body>
</html>
